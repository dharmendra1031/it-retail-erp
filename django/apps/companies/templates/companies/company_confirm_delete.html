{% extends "base.html" %}

{% block title %}Delete Company - IT Retail ERP{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card border-danger shadow-sm">
        <div class="card-body">
            <h1 class="h4">Delete Company</h1>
            <p class="mb-4">Are you sure you want to delete <strong>{{ object.name_en }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'companies:list' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
