name: ERP Verification

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    defaults:
      run:
        working-directory: django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODBC runtime
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        env:
          SECRET_KEY: ci-only-not-for-production
          DB_NAME: erp_ci
        run: python manage.py check
      - name: Django migration model drift
        env:
          SECRET_KEY: ci-only-not-for-production
          DB_NAME: erp_ci
        run: python manage.py makemigrations --check --dry-run
      - name: Django unit tests
        env:
          SECRET_KEY: ci-only-not-for-production
          DB_NAME: erp_ci
        run: python manage.py test apps.core apps.accounts apps.companies --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build

  aspnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aspnet-core/src/ITRetailERP.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release

  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-only-sql-integration-key
      DB_HOST: 127.0.0.1
      DB_PORT: "1433"
      DB_USER: sa
      DB_NAME: erp_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL Server ODBC driver
        run: |
          source /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/msprod.deb
          sudo dpkg -i /tmp/msprod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install Django dependencies
        run: python -m pip install -r django/requirements.txt
      - name: Start disposable SQL Server
        run: |
          password="Erp9$(openssl rand -hex 18)!"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --rm --name erp-test-sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
      - name: Wait for SQL Server
        run: |
          python - <<'PY'
          import os
          import time
          import pyodbc

          connection_string = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=127.0.0.1,1433;DATABASE=master;UID=sa;"
              f"PWD={os.environ['DB_PASSWORD']};Encrypt=yes;TrustServerCertificate=yes;"
          )
          for attempt in range(80):
              try:
                  with pyodbc.connect(connection_string, timeout=3, autocommit=True) as db:
                      db.execute("IF DB_ID('erp_integration') IS NULL CREATE DATABASE erp_integration")
                  print("Disposable SQL Server is ready")
                  break
              except pyodbc.Error:
                  time.sleep(3)
          else:
              raise RuntimeError("SQL Server did not become ready")
          PY
      - name: Run SQL Server migrations and integration tests
        working-directory: django
        run: |
          python manage.py migrate --noinput
          python manage.py migrate core zero --noinput
          python manage.py migrate core --noinput
          python manage.py test apps.core apps.accounts apps.companies --verbosity 2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply ASP.NET Core SQL Server migration
        run: |
          export ConnectionStrings__DefaultConnection="Server=127.0.0.1,1433;Database=erp_net_ci;User Id=sa;Password=$DB_PASSWORD;Encrypt=True;TrustServerCertificate=True"
          echo "ConnectionStrings__DefaultConnection=$ConnectionStrings__DefaultConnection" >> "$GITHUB_ENV"
          admin_password="Erp9$(openssl rand -hex 18)!"
          echo "::add-mask::$admin_password"
          echo "ERP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          dotnet restore aspnet-core/src/ITRetailERP.Web/ITRetailERP.Web.csproj
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef database update --project aspnet-core/src/ITRetailERP.Web/ITRetailERP.Web.csproj
          dotnet ef migrations has-pending-model-changes --project aspnet-core/src/ITRetailERP.Web/ITRetailERP.Web.csproj
      - name: ASP.NET Core document numbering integration tests
        run: dotnet test aspnet-core/tests/ITRetailERP.Tests/ITRetailERP.Tests.csproj --configuration Release --verbosity minimal
      - name: ASP.NET Core API + SQL Server smoke
        env:
          ERP_ADMIN_EMAIL: ci-admin@example.test
          ERP_ADMIN_NAME: CI Administrator
          ASPNETCORE_ENVIRONMENT: Development
        run: python aspnet-core/tests/smoke_sqlserver.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ASP.NET browser test dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run shared React UI against ASP.NET Core
        env:
          ERP_ADMIN_EMAIL: ci-admin@example.test
          ERP_ADMIN_NAME: CI Administrator
          ASPNETCORE_ENVIRONMENT: Development
          E2E_BACKEND: aspnet
          E2E_ADMIN_EMAIL: ci-admin@example.test
          VITE_PROXY_TARGET: http://127.0.0.1:5000
          CI: "true"
        run: |
          export E2E_PASSWORD="$ERP_ADMIN_PASSWORD"
          dotnet run --no-build --project aspnet-core/src/ITRetailERP.Web/ITRetailERP.Web.csproj --urls http://127.0.0.1:5000 > /tmp/aspnet-browser.log 2>&1 &
          cd frontend
          npm run test:e2e -- --grep "admin can manage roles"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-only-browser-key
      SQLITE_DB_PATH: /tmp/erp-browser.sqlite3
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_EMPLOYEE_EMAIL: staff@example.test
      VITE_PROXY_TARGET: http://127.0.0.1:8000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r django/requirements.txt
          cd frontend && npm install --no-audit --no-fund
      - name: Prepare test users and database
        working-directory: django
        run: |
          password="Erp9$(openssl rand -hex 18)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          export E2E_PASSWORD="$password"
          python manage.py migrate --noinput
          python manage.py shell -c '
          import os
          from apps.accounts.models import User
          User.objects.create_superuser(username="browseradmin", email=os.environ["E2E_ADMIN_EMAIL"], password=os.environ["E2E_PASSWORD"])
          User.objects.create_user(username="browserstaff", email=os.environ["E2E_EMPLOYEE_EMAIL"], password=os.environ["E2E_PASSWORD"])
          '
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
